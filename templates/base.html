<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}诗词天气{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="nav">
        <div class="nav-left">
            {% if request.endpoint != 'index' %}
            <a href="{{ url_for('index') }}" class="nav-back" aria-label="返回首页">
                <span class="nav-back-arrow">←</span> 返回首页
            </a>
            {% endif %}
        </div>
        <a href="{{ url_for('index') }}" class="nav-logo">诗词天气</a>
        <div class="nav-right"></div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>诗词天气 &middot; 天气驱动的每日诗词 &middot; <a href="https://dot.mindreset.tech" target="_blank">Dot. 墨水屏</a></p>
    </footer>
</body>
</html>
